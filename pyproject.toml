[project]
name = "self-improving-prompt-optimizer"
version = "0.1.1"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.0",
    "langgraph>=1.2.11",
    "openai>=3.0.0",
    "python-dotenv>=1.2.2",
    "referencing>=0.37.0",
    "streamlit>=1.61.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.81",
]
